version: "3.9"

services:
  app1:
    build: .
    env_file:
      - .env
    command: >
      sh -c "uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2"

  app2:
    build: .
    env_file:
      - .env
    command: >
      sh -c "uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2"

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
